services:
  web:
    build:
      context: .
    command: bash -lc "bundle exec rails assets:precompile && bundle exec rails db:prepare && bundle exec rails server -b 0.0.0.0 -p 3000"
    env_file:
      - .env
    volumes:
      - ./storage:/rails/storage
      - ./log:/rails/log
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  redis_data:
  caddy_data:
  caddy_config:
